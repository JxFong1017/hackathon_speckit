# Project Context Triage Extension Configuration
# Off by default. New projects are usually greenfield and live in one folder.
# List sibling codebases here only when implementation lives outside this repo.

targets: []

triage_all_targets: false

triage_hooks:
  default: false
  before_constitution:
    enabled: false
  before_specify:
    enabled: false
  before_plan:
    enabled: false
  before_tasks:
    enabled: false
  before_implement:
    enabled: false
