# Project Context Triage Extension Configuration
# Copied to .specify/extensions/project-context/project-context-config.yml on install

# Codebase repo folder names or paths where project-context.md lives.
# Resolved in order: absolute path → relative to SPECKIT_PROJECT_ROOT → workspace sibling
# (a sibling codebase, only when specs and code are split across repos).
#
# Examples (multi-root workspace):
#   targets:
#     - my-web
#     - my-api
targets: []

# When true, run triage for every target listed above. When false, only the first resolvable target.
# Default: off until a team lists real codebases.
triage_all_targets: false

# Per-hook triage toggles (existing Spec Kit events only).
# Set "default" to enable for all hooked events, then override per-event.
triage_hooks:
  default: false
  before_constitution:
    enabled: false
  before_specify:
    enabled: false
  before_plan:
    enabled: false
  before_tasks:
    enabled: false
  before_implement:
    enabled: false
